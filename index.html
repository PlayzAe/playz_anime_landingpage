<!doctype html>
<html lang="en" data-accent="shu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PlayzAnime: watch anime, read manga, keep both</title>
    <meta name="description" content="PlayzAnime is a free, ad-free app to watch and download anime and read and download manga, manhwa and manhua. For Windows and the web." />
    <meta name="theme-color" content="#0c0b0a" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PlayzAnime" />
    <meta property="og:title" content="PlayzAnime: watch anime, read manga, keep both" />
    <meta property="og:description" content="Free and ad-free. Stream or download anime, read manga, manhwa and manhua, even offline. For Windows and the web." />
    <meta property="og:url" content="%SITE_BASE%" />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The PlayzAnime seal next to the app's home screen" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PlayzAnime: watch anime, read manga, keep both" />
    <meta name="twitter:description" content="Free and ad-free. Stream or download anime, read manga, manhwa and manhua, even offline." />
    <meta name="twitter:image" content="%OG_IMAGE%" />

    <script>
      // Apply the saved accent before the first paint so the page never flashes the default ink.
      try {
        var a = localStorage.getItem('playzanime-site:accent');
        if (a && /^(shu|yamabuki|matcha|ai|sakura)$/.test(a)) document.documentElement.setAttribute('data-accent', a);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:24px;font-family:system-ui;color:#efe9e1;background:#0c0b0a">
        PlayzAnime's site needs JavaScript. Downloads and source code are on
        <a style="color:#f0532c" href="https://github.com/PlayzAe">GitHub</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
